name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, format, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest

  security:
    name: Security (SAST, secrets, SCA, licenses, IaC/container scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Hygiene, gitleaks and semgrep (same hooks as local pre-commit)
        run: |
          uv tool install semgrep
          uv tool install pre-commit
          pre-commit run --all-files
      - name: Dependency vulnerabilities (SCA)
        working-directory: api
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip
      - name: License policy (fail on strong copyleft)
        working-directory: api
        run: |
          uv sync --frozen --no-dev
          uvx pip-licenses --python .venv/bin/python --fail-on="GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3)"
      - name: Trivy (vulnerabilities, secrets, IaC misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: api
          format: spdx-json
          artifact-name: sbom-api.spdx.json
          upload-artifact: true
